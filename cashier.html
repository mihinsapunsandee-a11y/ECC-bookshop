<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashier - School Bookshop</title>
<style>
:root{--brand:#F85606;--brand2:#FF8A3D;--bg:#F2F3F5;--card:#fff;--ink:#212121;--muted:#757575;--edge:#E4E4E4;--new:#FFF3EC;--newedge:#FFD3B8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1E1E1E;--ink:#F1F1F1;--muted:#A5A5A5;--edge:#333;--new:#2A1E15;--newedge:#5A3A20}}
:root[data-theme="dark"]{--bg:#121212;--card:#1E1E1E;--ink:#F1F1F1;--muted:#A5A5A5;--edge:#333;--new:#2A1E15;--newedge:#5A3A20}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid #1B6EF3;outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:#fff}
.bar{max-width:800px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:1.25rem;flex:1}
.pill{background:rgba(255,255,255,.2);border-radius:99px;padding:6px 14px;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#7BE07B}
.tabs{max-width:800px;margin:0 auto;padding:0 16px 12px;display:flex;gap:8px}
.tabs button{background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:6px 16px;font-weight:700;font-size:.9rem}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--brand)}
main{max-width:800px;margin:0 auto;padding:16px}
.order{background:var(--card);border:1.5px solid var(--edge);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.order.new{background:var(--new);border-color:var(--newedge)}
.ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.oname{font-weight:800;font-size:1.05rem}
.otime{color:var(--muted);font-size:.8rem;margin-top:2px}
.ocontact{color:var(--muted);font-size:.82rem;margin-top:2px}
.badge{background:var(--brand);color:#fff;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.badge.done{background:#4FAE6A}
.badge.pending{background:#9C9C9C}
.items{margin:10px 0;font-size:.92rem}
.items div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--edge)}
.ototal{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;color:var(--brand);margin-top:8px}
.actions{margin-top:12px}
.done-btn{background:var(--brand);color:#fff;border-radius:8px;padding:9px 18px;font-weight:700}
.done-btn:disabled{background:var(--edge);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.err{background:#FFE9E9;color:#B23A3A;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:.9rem}
</style>
</head>
<body>
<header class="top">
<div class="bar">
<div class="logo">🧾 Cashier</div>
<div class="pill"><span class="dot"></span>Live</div>
</div>
<div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<script>
var SUPABASE_URL="https://bwilwzolobejlwgmhmev.supabase.co";
var SUPABASE_KEY="sb_publishable_75nKwBTMIO38Ipncbnl_qA_JFPC2hRQ";
var CUR="Rs. ";
var $=function(i){return document.getElementById(i)};
var view="new",orders=[];
function fmt(n){return CUR+Number(n).toLocaleString("en-US")}
function drawTabs(){
$("tabs").innerHTML=["new","all"].map(function(v){return '<button data-view="'+v+'" aria-pressed="'+(v===view)+'">'+(v==="new"?"New orders":"All orders")+'</button>'}).join("")
}
function render(){
var list=view==="new"?orders.filter(function(o){return o.status==="paid"}):orders;
if(!list.length){$("main").innerHTML='<p class="empty">'+(view==="new"?"No new orders right now.":"No orders yet.")+'</p>';return}
$("main").innerHTML=list.map(function(o){
var when=new Date(o.created_at).toLocaleString();
var itemsHtml=(o.items||[]).map(function(it){return '<div><span>'+it.name+' x'+it.qty+'</span><span>'+fmt(it.line_total)+'</span></div>'}).join("");
var isReady=o.status==="paid";
var isPending=o.status==="pending";
var isCancelled=o.status==="cancelled";
var badgeClass=isReady?"":(isPending?" pending":(isCancelled?" pending":" done"));
var badgeText=isReady?"NEW":(isPending?"AWAITING PAYMENT":(isCancelled?"CANCELLED":"DONE"));
var contactBits=[];
if(o.phone)contactBits.push("📞 "+o.phone);
if(o.card_name)contactBits.push("💳 "+o.card_name);
var contactHtml=contactBits.length?'<div class="ocontact">'+contactBits.join(" &nbsp;·&nbsp; ")+'</div>':"";
return '<div class="order'+(isReady?" new":"")+'">'
+'<div class="ohead"><div><div class="oname">'+o.customer_name+'</div><div class="otime">'+when+'</div>'+contactHtml+'</div><span class="badge'+badgeClass+'">'+badgeText+'</span></div>'
+'<div class="items">'+itemsHtml+'</div>'
+'<div class="ototal"><span>Total</span><span>'+fmt(o.total)+'</span></div>'
+(isReady?'<div class="actions"><button class="done-btn" data-done="'+o.id+'">Mark as Done</button></div>':'')
+'</div>'
}).join("")
}
function loadOrders(){
fetch(SUPABASE_URL+"/rest/v1/orders?select=*&order=created_at.desc",{
headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}
}).then(function(r){if(!r.ok)throw new Error("bad response");return r.json()})
.then(function(data){orders=data;render()})
.catch(function(){$("main").innerHTML='<p class="err">Could not load orders. Check your internet connection — this page will keep trying.</p>'})
}
function markDone(id){
fetch(SUPABASE_URL+"/rest/v1/orders?id=eq."+id,{
method:"PATCH",
headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
body:JSON.stringify({status:"completed"})
}).then(function(){loadOrders()})
}
document.addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;var d=b.dataset;
if(d.view){view=d.view;drawTabs();render()}
else if(d.done){markDone(d.done)}
});
drawTabs();
loadOrders();
setInterval(loadOrders,6000);
</script>
</body>
</html>
